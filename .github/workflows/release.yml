name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example: v1.8.0-personal.1)'
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --draft \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi

  release-darwin:
    name: Build & upload macOS artifacts
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Install Wails CLI
        run: |
          # Pin the CLI to the version in go.mod: @latest can require a newer
          # Go toolchain than the one setup-go installs (GOTOOLCHAIN=local).
          wails_version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${wails_version}"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build macOS artifacts
        run: make darwin

      - name: Upload macOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            build/bin/gomander-darwin-amd64.dmg \
            build/bin/gomander-darwin-arm64.dmg \
            build/bin/gomander-darwin-amd64.app.zip \
            build/bin/gomander-darwin-arm64.app.zip \
            --clobber

  release-windows:
    name: Build & upload Windows artifacts
    needs: create-release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Install Wails CLI
        run: |
          # Pin the CLI to the version in go.mod: @latest can require a newer
          # Go toolchain than the one setup-go installs (GOTOOLCHAIN=local).
          wails_version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${wails_version}"

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> $GITHUB_PATH

      - name: Build Windows amd64
        working-directory: cmd/gomander
        run: |
          wails build -nsis --platform=windows/amd64 -o=gomander-windows-amd64-portable.exe
          mv ../../build/bin/gomander-amd64-installer.exe ../../build/bin/gomander-windows-amd64-installer.exe

      - name: Build Windows arm64
        working-directory: cmd/gomander
        run: |
          wails build -nsis --platform=windows/arm64 -o=gomander-windows-arm64-portable.exe
          mv ../../build/bin/gomander-arm64-installer.exe ../../build/bin/gomander-windows-arm64-installer.exe

      - name: Upload Windows artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            build/bin/gomander-windows-amd64-portable.exe \
            build/bin/gomander-windows-arm64-portable.exe \
            build/bin/gomander-windows-amd64-installer.exe \
            build/bin/gomander-windows-arm64-installer.exe \
            --clobber

  release-linux:
    name: Build & upload Linux ${{ matrix.arch }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config gcc g++ libc6-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libnss3-dev libxss1 libasound2-dev

      - name: Install Wails CLI
        run: |
          # Pin the CLI to the version in go.mod: @latest can require a newer
          # Go toolchain than the one setup-go installs (GOTOOLCHAIN=local).
          wails_version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${wails_version}"

      - name: Build Linux ${{ matrix.arch }} binary
        run: |
          cd cmd/gomander
          wails build -tags webkit2_41
          cd ../..
          mv build/bin/gomander build/bin/gomander-linux-${{ matrix.arch }}

      - name: Build .deb package
        run: |
          bash scripts/create-deb.sh \
            build/bin/gomander-linux-${{ matrix.arch }} \
            ${{ matrix.arch }} \
            "${RELEASE_TAG#v}"

      - name: Upload Linux ${{ matrix.arch }} artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            build/bin/gomander-linux-${{ matrix.arch }} \
            build/bin/gomander_${RELEASE_TAG#v}_${{ matrix.arch }}.deb \
            --clobber
